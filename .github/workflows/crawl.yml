name: Update bill data
on:
  schedule:
    - cron: "0 8 * * *"      # 2:00 AM Mountain (08:00 UTC) every night
  workflow_dispatch: {}       # lets you run it by hand from the GitHub app

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl directory listings
        run: python crawl.py
      - name: Commit changes
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add data/tracker.json
          git diff --cached --quiet || git commit -m "Update data"
          git push
