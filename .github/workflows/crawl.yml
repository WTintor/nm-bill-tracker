name: Update bill data
on:
  schedule:
    - cron: "0 8 * * *"        # 2:00 AM Mountain (08:00 UTC) every night
  workflow_dispatch:
    inputs:
      full:
        description: "Re-crawl every session (slow)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-updates          # one data job at a time, so they can't overwrite each other
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf beautifulsoup4
      - name: Crawl every session and collect titles
        env:
          TITLE_BUDGET: "5000"
          FULL: ${{ github.event.inputs.full == 'true' && '1' || '' }}
        run: |
          # Older sessions are refreshed on the 1st of each month.
          if [ "$(date -u +%d)" = "01" ]; then export FULL=1; fi
          python crawl.py
      - name: Official legislative status for every session
        continue-on-error: true
        run: python enrich.py status all
      - name: One-time look at the LegInfo download and bill pages
        continue-on-error: true
        run: |
          if [ ! -f data/probe/report.txt ]; then python enrich.py probe; fi
      - name: One-time look at calendar, legislator and committee pages
        continue-on-error: true
        run: |
          if [ ! -f data/probe/report2.txt ]; then python enrich.py probe2; fi
      - name: Compare introduced vs latest text for the current session
        continue-on-error: true
        run: |
          python - <<'PY' > /tmp/cur.txt
          import json
          s = json.load(open("data/tracker.json"))["sessions"]
          print(max((k for k in s if s[k]["k"] == "Regular"), key=lambda k: s[k]["y"]))
          PY
          python versions.py "$(cat /tmp/cur.txt)" --budget 300
      - name: Current legislators
        continue-on-error: true
        run: python roster.py
      - name: Committee hearing schedules
        continue-on-error: true
        run: python schedules.py --budget 120
      - name: Log status changes
        continue-on-error: true
        run: python changes.py "$(cat /tmp/cur.txt)"
      - name: Email digest to subscribers
        continue-on-error: true
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python digest.py
      - name: Commit changes
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update data"
          # Another job may have saved data while this one ran. Replay our newer data on top of theirs, and retry.
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
